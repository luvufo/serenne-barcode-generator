<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Serenne Product Code Generator</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f8f5ff;
  padding: 40px;
}

.container {
  max-width: 700px;
  margin: auto;
  background: white;
  padding: 30px;
  border-radius: 20px;
  box-shadow: 0 0 20px rgba(0,0,0,0.1);
}

h1 {
  text-align: center;
  color: #7d5fff;
}

label {
  font-weight: bold;
}

input, select {
  width: 100%;
  padding: 12px;
  margin-top: 8px;
  margin-bottom: 15px;
  border: 1px solid #ddd;
  border-radius: 10px;
  box-sizing: border-box;
}

button {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 10px;
  background: #a78bfa;
  color: white;
  font-size: 16px;
  cursor: pointer;
  margin-bottom: 10px;
}

.small-button {
  background: #ddd;
  color: #333;
}

.result {
  margin-top: 20px;
  padding: 20px;
  background: #f3f0ff;
  border-radius: 10px;
  text-align: center;
}

.code {
  font-size: 26px;
  font-weight: bold;
  color: #7d5fff;
}

.history {
  margin-top: 20px;
  background: #fafafa;
  padding: 15px;
  border-radius: 10px;
}
</style>
</head>

<body>
<div class="container">

<h1>💜 Serenne Product Code Generator</h1>

<label>브랜드 코드</label>
<input type="text" id="brand" placeholder="예: SRN">

<label>카테고리 선택</label>
<select id="category"></select>

<label>새 카테고리 추가</label>
<input type="text" id="newCategory" placeholder="예: KNIT, BAG, SHOES">
<button onclick="addCategory()">카테고리 추가하기</button>
<button class="small-button" onclick="deleteCategory()">선택한 카테고리 삭제</button>

<button onclick="generateCode()">상품코드 생성하기</button>

<div class="result" id="result">
상품코드가 여기에 표시됩니다.
</div>

<div class="history">
  <h3>생성 기록</h3>
  <div id="historyList">아직 생성된 코드가 없습니다.</div>
</div>

</div>

<script>
let categories = JSON.parse(localStorage.getItem("categories")) || ["TOP", "BTM", "OPS", "OUT", "ACC"];
let counters = JSON.parse(localStorage.getItem("counters")) || {};
let history = JSON.parse(localStorage.getItem("history")) || [];

function saveData() {
  localStorage.setItem("categories", JSON.stringify(categories));
  localStorage.setItem("counters", JSON.stringify(counters));
  localStorage.setItem("history", JSON.stringify(history));
}

function renderCategories() {
  const categorySelect = document.getElementById("category");
  categorySelect.innerHTML = "";

  categories.forEach(category => {
    const option = document.createElement("option");
    option.value = category;
    option.textContent = category;
    categorySelect.appendChild(option);
  });
}

function renderHistory() {
  const historyList = document.getElementById("historyList");

  if (history.length === 0) {
    historyList.innerHTML = "아직 생성된 코드가 없습니다.";
    return;
  }

  historyList.innerHTML = history
    .map(code => `<p>${code}</p>`)
    .join("");
}

function addCategory() {
  const newCategoryInput = document.getElementById("newCategory");
  const newCategory = newCategoryInput.value.trim().toUpperCase();

  if (newCategory === "") {
    alert("추가할 카테고리를 입력해 주세요.");
    return;
  }

  if (categories.includes(newCategory)) {
    alert("이미 있는 카테고리입니다.");
    return;
  }

  categories.push(newCategory);
  counters[newCategory] = 1;
  newCategoryInput.value = "";

  saveData();
  renderCategories();
}

function deleteCategory() {
  const selectedCategory = document.getElementById("category").value;

  if (!selectedCategory) return;

  const confirmDelete = confirm(selectedCategory + " 카테고리를 삭제할까요?");

  if (!confirmDelete) return;

  categories = categories.filter(category => category !== selectedCategory);
  delete counters[selectedCategory];

  saveData();
  renderCategories();
}

function generateCode() {
  const brand = document.getElementById("brand").value.trim().toUpperCase();
  const category = document.getElementById("category").value;

  if (brand === "") {
    document.getElementById("result").innerHTML = "브랜드 코드를 입력해 주세요.";
    return;
  }

  if (!counters[category]) {
    counters[category] = 1;
  }

  const number = String(counters[category]).padStart(4, "0");
  const productCode = `${brand}-${category}-${number}`;

  document.getElementById("result").innerHTML = `
    <div class="code">${productCode}</div>
    <button onclick="copyCode('${productCode}')">복사하기</button>
  `;

  history.unshift(productCode);
  counters[category]++;

  saveData();
  renderHistory();
}

function copyCode(code) {
  navigator.clipboard.writeText(code);
  alert("복사 완료: " + code);
}

renderCategories();
renderHistory();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Serenne Barcode Label Manager</title>

<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f8f5ff;
  padding: 40px;
}

.container {
  max-width: 850px;
  margin: auto;
  background: white;
  padding: 30px;
  border-radius: 20px;
  box-shadow: 0 0 20px rgba(0,0,0,0.1);
}

h1, h2 {
  text-align: center;
  color: #7d5fff;
}

label {
  font-weight: bold;
}

input, select {
  width: 100%;
  padding: 12px;
  margin-top: 8px;
  margin-bottom: 15px;
  border: 1px solid #ddd;
  border-radius: 10px;
  box-sizing: border-box;
}

button {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 10px;
  background: #a78bfa;
  color: white;
  font-size: 16px;
  cursor: pointer;
  margin-bottom: 10px;
}

.small-button {
  background: #ddd;
  color: #333;
}

.result, .search-box, .list {
  margin-top: 20px;
  padding: 20px;
  background: #f3f0ff;
  border-radius: 10px;
}

.label-card {
  text-align: center;
  background: white;
  padding: 18px;
  border-radius: 12px;
  margin: 15px 0;
  border: 1px solid #eee;
}

.product-name {
  font-size: 18px;
  font-weight: bold;
  margin-bottom: 8px;
}

.product-info {
  font-size: 14px;
  color: #555;
  margin-bottom: 8px;
}

.code {
  font-size: 16px;
  font-weight: bold;
  color: #7d5fff;
  margin-bottom: 8px;
}

.item {
  background: white;
  padding: 15px;
  margin-top: 12px;
  border-radius: 10px;
  border: 1px solid #eee;
}

.item strong {
  color: #7d5fff;
}
</style>
</head>

<body>
<div class="container">

<h1>💜 Serenne Barcode Label Manager</h1>

<label>상품명</label>
<input type="text" id="productName" placeholder="예: 로제 자가드 스커트">

<label>색상</label>
<input type="text" id="color" placeholder="예: Ivory">

<label>사이즈</label>
<input type="text" id="size" placeholder="예: Free">

<label>브랜드 코드</label>
<input type="text" id="brand" value="SRN">

<label>카테고리 선택</label>
<select id="category"></select>

<label>새 카테고리 추가</label>
<input type="text" id="newCategory" placeholder="예: KNIT, BAG, SHOES">
<button onclick="addCategory()">카테고리 추가하기</button>
<button class="small-button" onclick="deleteCategory()">선택한 카테고리 삭제</button>

<button onclick="generateProduct()">라벨 + 바코드 생성하기</button>

<div class="result" id="result">
생성된 라벨이 여기에 표시됩니다.
</div>

<div class="search-box">
  <h2>상품 조회</h2>
  <input type="text" id="searchKeyword" placeholder="상품명, 색상, 사이즈, 상품코드로 검색" oninput="renderProducts()">
</div>

<div class="list">
  <h2>저장된 상품 목록</h2>
  <div id="productList">아직 저장된 상품이 없습니다.</div>
</div>

</div>

<script>
let categories = JSON.parse(localStorage.getItem("categories")) || ["TOP", "BTM", "OPS", "OUT", "ACC", "SKIRT"];
let counters = JSON.parse(localStorage.getItem("counters")) || {};
let products = JSON.parse(localStorage.getItem("products")) || [];

function saveData() {
  localStorage.setItem("categories", JSON.stringify(categories));
  localStorage.setItem("counters", JSON.stringify(counters));
  localStorage.setItem("products", JSON.stringify(products));
}

function renderCategories() {
  const categorySelect = document.getElementById("category");
  categorySelect.innerHTML = "";

  categories.forEach(category => {
    const option = document.createElement("option");
    option.value = category;
    option.textContent = category;
    categorySelect.appendChild(option);
  });
}

function addCategory() {
  const input = document.getElementById("newCategory");
  const newCategory = input.value.trim().toUpperCase();

  if (newCategory === "") {
    alert("추가할 카테고리를 입력해 주세요.");
    return;
  }

  if (categories.includes(newCategory)) {
    alert("이미 있는 카테고리입니다.");
    return;
  }

  categories.push(newCategory);
  counters[newCategory] = 1;
  input.value = "";

  saveData();
  renderCategories();
}

function deleteCategory() {
  const selectedCategory = document.getElementById("category").value;
  if (!selectedCategory) return;

  if (!confirm(selectedCategory + " 카테고리를 삭제할까요?")) return;

  categories = categories.filter(category => category !== selectedCategory);
  delete counters[selectedCategory];

  saveData();
  renderCategories();
}

function generateProduct() {
  const productName = document.getElementById("productName").value.trim();
  const color = document.getElementById("color").value.trim();
  const size = document.getElementById("size").value.trim();
  const brand = document.getElementById("brand").value.trim().toUpperCase();
  const category = document.getElementById("category").value;

  if (productName === "") {
    alert("상품명을 입력해 주세요.");
    return;
  }

  if (brand === "") {
    alert("브랜드 코드를 입력해 주세요.");
    return;
  }

  if (!counters[category]) {
    counters[category] = 1;
  }

  const number = String(counters[category]).padStart(4, "0");
  const productCode = `${brand}-${category}-${number}`;

  const product = {
    name: productName,
    color: color,
    size: size,
    code: productCode,
    category: category,
    createdAt: new Date().toLocaleString()
  };

  products.unshift(product);
  counters[category]++;
  saveData();

  document.getElementById("result").innerHTML = makeLabelHTML(product, "barcode-main");

  createBarcode("barcode-main", productCode);
  renderProducts();
}

function makeLabelHTML(product, barcodeId) {
  return `
    <div class="label-card" id="label-${barcodeId}">
      <div class="product-name">${product.name}</div>
      <div class="product-info">Color: ${product.color || "-"} / Size: ${product.size || "-"}</div>
      <div class="code">${product.code}</div>
      <svg id="${barcodeId}"></svg>
    </div>
    <button onclick="copyCode('${product.code}')">상품코드 복사</button>
    <button onclick="downloadLabel('label-${barcodeId}', '${product.code}')">라벨 PNG 다운로드</button>
  `;
}

function renderProducts() {
  const list = document.getElementById("productList");
  const keyword = document.getElementById("searchKeyword").value.trim().toLowerCase();

  const filtered = products.filter(product =>
    product.name.toLowerCase().includes(keyword) ||
    product.code.toLowerCase().includes(keyword) ||
    product.category.toLowerCase().includes(keyword) ||
    (product.color || "").toLowerCase().includes(keyword) ||
    (product.size || "").toLowerCase().includes(keyword)
  );

  if (filtered.length === 0) {
    list.innerHTML = "조회된 상품이 없습니다.";
    return;
  }

  list.innerHTML = filtered.map((product, index) => `
    <div class="item">
      ${makeLabelHTML(product, "savedBarcode" + index)}
      <p><strong>카테고리:</strong> ${product.category}</p>
      <p><strong>생성일:</strong> ${product.createdAt}</p>
      <button class="small-button" onclick="deleteProduct('${product.code}')">삭제</button>
    </div>
  `).join("");

  filtered.forEach((product, index) => {
    createBarcode("savedBarcode" + index, product.code);
  });
}

function createBarcode(elementId, code) {
  JsBarcode("#" + elementId, code, {
    format: "CODE128",
    lineColor: "#333",
    width: 2,
    height: 70,
    displayValue: false,
    margin: 8
  });
}

function downloadLabel(labelId, code) {
  const label = document.getElementById(labelId);

  html2canvas(label).then(canvas => {
    const link = document.createElement("a");
    link.download = code + "-label.png";
    link.href = canvas.toDataURL("image/png");
    link.click();
  });
}

function copyCode(code) {
  navigator.clipboard.writeText(code);
  alert("복사 완료: " + code);
}

function deleteProduct(code) {
  if (!confirm("이 상품을 삭제할까요?")) return;

  products = products.filter(product => product.code !== code);
  saveData();
  renderProducts();
}

renderCategories();
renderProducts();
</script>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Serenne Barcode Manager</title>

<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f8f5ff;
  padding: 40px;
}

.container {
  max-width: 800px;
  margin: auto;
  background: white;
  padding: 30px;
  border-radius: 20px;
  box-shadow: 0 0 20px rgba(0,0,0,0.1);
}

h1, h2 {
  text-align: center;
  color: #7d5fff;
}

label {
  font-weight: bold;
}

input, select {
  width: 100%;
  padding: 12px;
  margin-top: 8px;
  margin-bottom: 15px;
  border: 1px solid #ddd;
  border-radius: 10px;
  box-sizing: border-box;
}

button {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 10px;
  background: #a78bfa;
  color: white;
  font-size: 16px;
  cursor: pointer;
  margin-bottom: 10px;
}

.small-button {
  background: #ddd;
  color: #333;
}

.result, .search-box, .list {
  margin-top: 20px;
  padding: 20px;
  background: #f3f0ff;
  border-radius: 10px;
}

.code {
  font-size: 24px;
  font-weight: bold;
  color: #7d5fff;
  text-align: center;
}

.item {
  background: white;
  padding: 15px;
  margin-top: 12px;
  border-radius: 10px;
  border: 1px solid #eee;
}

.item strong {
  color: #7d5fff;
}
</style>
</head>

<body>
<div class="container">

<h1>💜 Serenne Barcode Manager</h1>

<label>상품명</label>
<input type="text" id="productName" placeholder="예: 로제 리본 블라우스">

<label>브랜드 코드</label>
<input type="text" id="brand" placeholder="예: SRN">

<label>카테고리 선택</label>
<select id="category"></select>

<label>새 카테고리 추가</label>
<input type="text" id="newCategory" placeholder="예: KNIT, BAG, SHOES">
<button onclick="addCategory()">카테고리 추가하기</button>
<button class="small-button" onclick="deleteCategory()">선택한 카테고리 삭제</button>

<button onclick="generateProduct()">상품코드 + 바코드 생성하기</button>

<div class="result" id="result">
상품코드와 바코드가 여기에 표시됩니다.
</div>

<div class="search-box">
  <h2>상품 조회</h2>
  <input type="text" id="searchKeyword" placeholder="상품명을 입력해 검색하세요" oninput="renderProducts()">
</div>

<div class="list">
  <h2>저장된 상품 목록</h2>
  <div id="productList">아직 저장된 상품이 없습니다.</div>
</div>

</div>

<script>
let categories = JSON.parse(localStorage.getItem("categories")) || ["TOP", "BTM", "OPS", "OUT", "ACC"];
let counters = JSON.parse(localStorage.getItem("counters")) || {};
let products = JSON.parse(localStorage.getItem("products")) || [];

function saveData() {
  localStorage.setItem("categories", JSON.stringify(categories));
  localStorage.setItem("counters", JSON.stringify(counters));
  localStorage.setItem("products", JSON.stringify(products));
}

function renderCategories() {
  const categorySelect = document.getElementById("category");
  categorySelect.innerHTML = "";

  categories.forEach(category => {
    const option = document.createElement("option");
    option.value = category;
    option.textContent = category;
    categorySelect.appendChild(option);
  });
}

function addCategory() {
  const input = document.getElementById("newCategory");
  const newCategory = input.value.trim().toUpperCase();

  if (newCategory === "") {
    alert("추가할 카테고리를 입력해 주세요.");
    return;
  }

  if (categories.includes(newCategory)) {
    alert("이미 있는 카테고리입니다.");
    return;
  }

  categories.push(newCategory);
  counters[newCategory] = 1;
  input.value = "";

  saveData();
  renderCategories();
}

function deleteCategory() {
  const selectedCategory = document.getElementById("category").value;

  if (!selectedCategory) return;

  if (!confirm(selectedCategory + " 카테고리를 삭제할까요?")) return;

  categories = categories.filter(category => category !== selectedCategory);
  delete counters[selectedCategory];

  saveData();
  renderCategories();
}

function generateProduct() {
  const productName = document.getElementById("productName").value.trim();
  const brand = document.getElementById("brand").value.trim().toUpperCase();
  const category = document.getElementById("category").value;

  if (productName === "") {
    alert("상품명을 입력해 주세요.");
    return;
  }

  if (brand === "") {
    alert("브랜드 코드를 입력해 주세요.");
    return;
  }

  if (!counters[category]) {
    counters[category] = 1;
  }

  const number = String(counters[category]).padStart(4, "0");
  const productCode = `${brand}-${category}-${number}`;

  const product = {
    name: productName,
    code: productCode,
    category: category,
    createdAt: new Date().toLocaleString()
  };

  products.unshift(product);
  counters[category]++;

  saveData();

  document.getElementById("result").innerHTML = `
    <div class="code">${productCode}</div>
    <svg id="barcode"></svg>
    <p>${productName}</p>
    <button onclick="copyCode('${productCode}')">상품코드 복사하기</button>
  `;

  JsBarcode("#barcode", productCode, {
    format: "CODE128",
    lineColor: "#333",
    width: 2,
    height: 80,
    displayValue: true
  });

  renderProducts();
}

function renderProducts() {
  const list = document.getElementById("productList");
  const keyword = document.getElementById("searchKeyword").value.trim().toLowerCase();

  const filtered = products.filter(product =>
    product.name.toLowerCase().includes(keyword) ||
    product.code.toLowerCase().includes(keyword) ||
    product.category.toLowerCase().includes(keyword)
  );

  if (filtered.length === 0) {
    list.innerHTML = "조회된 상품이 없습니다.";
    return;
  }

  list.innerHTML = filtered.map((product, index) => `
    <div class="item">
      <p><strong>상품명:</strong> ${product.name}</p>
      <p><strong>상품코드:</strong> ${product.code}</p>
      <p><strong>카테고리:</strong> ${product.category}</p>
      <p><strong>생성일:</strong> ${product.createdAt}</p>
      <svg id="savedBarcode${index}"></svg>
      <button onclick="copyCode('${product.code}')">복사하기</button>
      <button class="small-button" onclick="deleteProduct('${product.code}')">삭제하기</button>
    </div>
  `).join("");

  filtered.forEach((product, index) => {
    JsBarcode(`#savedBarcode${index}`, product.code, {
      format: "CODE128",
      lineColor: "#333",
      width: 2,
      height: 60,
      displayValue: true
    });
  });
}

function copyCode(code) {
  navigator.clipboard.writeText(code);
  alert("복사 완료: " + code);
}

function deleteProduct(code) {
  if (!confirm("이 상품을 삭제할까요?")) return;

  products = products.filter(product => product.code !== code);
  saveData();
  renderProducts();
}

renderCategories();
renderProducts();
</script>

</body>
</html>
